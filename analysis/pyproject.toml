[project]
name = "ringagain-analysis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "beat-this",
    "brotli>=1.2.0",
    "demucs>=4.0.1",
    "fonttools>=4.66.1",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "stable-ts>=2.19.1",
    "torch>=2.4",
    "torchaudio>=2.11.0",
    "transformers>=5.19.0",
]

[project.scripts]
ringagain-analysis = "ringagain_analysis:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
beat-this = { url = "https://github.com/CPJKU/beat_this/archive/main.zip" }
